############################################## WHEEL ODOMETRY ##############################################
ekf_wheel_odometry:
  frequency: 30
  sensor_timeout: 0.1
  two_d_mode: false
  transform_time_offset: 0.0
  transform_timeout: 0.0
  publish_tf: false
  print_diagnostics: true
  debug: false

  map_frame: map
  odom_frame: odom
  base_link_frame: base_link
  world_frame: odom

  odom0: /mobile_base_controller/odom
  odom0_config: [ false, false, false,
                  false, false, false,
                  true, true, false,
                  false, false, false,
                  false, false, false ]
  odom0_queue_size: 10
  odom0_nodelay: true
  odom0_differential: false
  odom0_relative: true

  imu0: /bno085/imu
