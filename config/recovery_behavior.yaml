recovery_behaviors:
  - name: 'clear_costmap_laser'
    type: 'clear_costmap_recovery/ClearCostmapRecovery'
  - name: 'clear_costmap_static'
    type: 'clear_costmap_recovery/ClearCostmapRecovery'
  - name: 'clear_costmap'
    type: 'clear_costmap_recovery/ClearCostmapRecovery'

clear_costmap:
  reset_distance: 2
  force_updating: true
  invert_area_to_clear: true
#  both, local, global
  affected_maps: both
  # static_layer removed: clearing the static map only blanks real mapped walls
  # for a single update cycle (it reloads from /navi_manager/map immediately) and
  # can briefly let the planner cut through a wall. Map "ghosts" must be fixed in
  # the map itself, not worked around via costmap clearing.
  layer_names: [laser_layer]

clear_costmap_laser:
  reset_distance: 1
  force_updating: true
  invert_area_to_clear: false
#  both, local, global
  affected_maps: both
  layer_names: [laser_layer]

clear_costmap_static:
  reset_distance: 2
  force_updating: true
  invert_area_to_clear: true
#  both, local, global
  affected_maps: both
  layer_names: [static_layer]