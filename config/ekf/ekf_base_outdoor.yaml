                 true,  true,  true,
                 false, false, false,
                 false, false, false,
                 false, false, false ]
  imu0_nodelay: true
  imu0_differential: false
  imu0_relative: true
  imu0_queue_size: 10
  imu0_remove_gravitational_acceleration: true

  use_control: false

