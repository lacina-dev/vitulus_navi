global_costmap:
#  global_frame: t265_odom_frame
  global_frame: map
  robot_base_frame: base_link

  update_frequency: 1.0  # was 0.5 - raised so the global planner sees live
  publish_frequency: 1.0  # obstacles fresh enough to plan a detour around them
  static_map: true
  # AUDIT A18 (2026-08-01): inflation_radius used to sit at the costmap top
  # level (legacy pre-plugin location) where it silently OVERRODE the 0.5 from
  # costmap_common_params' inflation_layer block. 0.85 was the live behaviour,
  # so it is kept — but now declared where it actually belongs, per-layer:
  inflation_layer:
    inflation_radius: 0.85
    cost_scaling_factor: 10.0
  plugins:
    - name: static_layer
      type: "costmap_2d::StaticLayer"
    # Live obstacle layer so the GLOBAL planner (get_path) can route AROUND
    # obstacles that appear on the mowing line.
    #
    # IMPORTANT: this MUST be an ObstacleLayer, NOT a StaticLayer. A StaticLayer
    # in a non-rolling (static_map: true) costmap *resizes* the master grid to
    # the incoming map. Mirroring the rolling local maps as StaticLayers here
    # shrank the global costmap to 5x5 m and erased the walls -> the planner
    # routed straight through them. ObstacleLayer only overlays sensor
    # observations (never resizes) and self-clears via raytracing.
    # MEMORYLESS (2026-08-16, user field test): NonPersistentVoxelLayer marks
    # ONLY what the sensors see in the current update and forgets everything
    # each cycle — the old ObstacleLayer accumulated marks across the whole
    # drive (a "map that builds as you drive" that confused the factory-fresh
    # test and went stale between mows). The global planner still detours
    # around CURRENTLY-seen obstacles (that was this layer's purpose); past
    # sightings no longer haunt the costmap. Local rolling costmap unchanged.
    - name: obstacle_layer
      type: "costmap_2d::NonPersistentVoxelLayer"
    - name: inflation_layer
      type: "costmap_2d::InflationLayer"

  # NOTE: static_layer keeps its default map topic ("map", remapped to the
  # loaded field map by the move_base_flex node), so it is intentionally left
  # without an explicit map_topic here. It stays the size master for the costmap.

  obstacle_layer:
    observation_sources: laser_scan obstacles_pc
    combination_method: 1          # 1 = max (do not override the static map)
    track_unknown_space: false
    # NonPersistentVoxelLayer voxel grid (2026-08-16): shallow 3-voxel column
    # covering the 0..0.6 m obstacle band; mark_threshold 0 = one hit marks.
    publish_voxel_map: false
    origin_z: 0.0
    z_resolution: 0.2
    z_voxels: 3
    unknown_threshold: 15
    mark_threshold: 0

    # 2D lidar (already range-limited to 5 m), height-filtered like the original
    # local-costmap laser config.
    laser_scan:
      data_type: LaserScan
      topic: /rplidar/scan_5m
      marking: true
      clearing: true
      obstacle_range: 3.0
      raytrace_range: 5.0
      min_obstacle_height: 0.0
      max_obstacle_height: 0.4
      inf_is_valid: true
      expected_update_rate: 0.0

    # 3D obstacle points (ground already removed upstream -> low grass ignored).
    obstacles_pc:
      data_type: PointCloud2
      topic: /obstacles_cloud
      marking: true
      clearing: true
      # ranges/heights sjednoceny s upstream (point_cloud_xyz max_depth 3.5,
      # obstacles_detection MaxObstacleHeight 0.5) - drive byly no-op (mracno
      # je orezane uz pred costmapou).
      obstacle_range: 3.5
      raytrace_range: 6.0
      min_obstacle_height: 0.05
      max_obstacle_height: 0.5
      expected_update_rate: 0.5   # 0->0.5: hlasi vypadek detekce (~2 Hz zdroj)



