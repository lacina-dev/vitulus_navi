recovery_behaviors:
  - name: 'clear_costmap_laser'
    type: 'clear_costmap_recovery/ClearCostmapRecovery'
  - name: 'clear_costmap_static'
    type: 'clear_costmap_recovery/ClearCostmapRecovery'
  - name: 'clear_costmap'
    type: 'clear_costmap_recovery/ClearCostmapRecovery'

clear_costmap:
  reset_distance: 2
  force_updating: true
  invert_area_to_clear: true
#  both, local, global
  affected_maps: both
  # static_layer is intentionally NOT cleared: blanking the mapped walls for a
  # single cycle (they reload from /navi_manager/map immediately) can briefly let
  # the planner cut through a wall. Map "ghosts" must be fixed in the map itself.
  # We clear the LIVE obstacle layers instead. These are the actual plugin names
  # in both the local and (newly) global costmaps. The previous value
  # [laser_layer] matched no plugin in any costmap, so this recovery was a no-op.
  # Note: obstacles come from self-decaying source maps, so a clear only blanks
  # them for one cycle; it mainly helps reset a momentarily stuck cell before a
  # retry. Persistent obstacles are handled by the DETOUR logic in mower_smach.
  layer_names: [lidar_costmap_layer, cloud_costmap_layer, obstacle_layer]

clear_costmap_laser:
  reset_distance: 1
  force_updating: true
  invert_area_to_clear: false
#  both, local, global
  affected_maps: both
  layer_names: [lidar_costmap_layer, cloud_costmap_layer, obstacle_layer]

clear_costmap_static:
  reset_distance: 2
  force_updating: true
  invert_area_to_clear: true
#  both, local, global
  affected_maps: both
  layer_names: [static_layer]