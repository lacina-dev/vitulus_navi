### Navi manager init ###

# Name of the map to load (create new map if empty).
# Boot-in-dock: load the production outdoor map so the dock seed can place the
# robot in it immediately (no GPS needed). The map MUST contain the "docked"
# waypoint (be docked + localized, then publish "docked" to /navi_manager/save_waypoint
# and SAVE the map).
#
# RETIRED (delegacy 2026-07-19): legacy navi maps must NOT be USED anywhere — the
# robot boots purely on the mapping-v3 served-site world (see legacy_maps below).
# COMMENTED OUT so it is never loaded. To ROLL BACK the retirement: UNCOMMENT this
# line AND set legacy_maps: true.
# load_map_on_start: "GARDEN_2026***env*OUTDOOR"

# When loading a map (at boot AND from the UI), also start the rtabmap docker
# container in LOCALIZATION mode on it.
# Localization v2 (2026-07-11, user decision): rtabmap is OUT of map-making and
# out of the pose path. Localization is rtabmap-free (fusion EKF + GPS-RTK + dock
# seed); maps are served from the mapping_v3 octomap pipeline (map_source_on_start
# below). So RTABMAP_MAPPING must NOT be required at boot -> false.
# NOTE: RTABMAP_ODOM_SYNC + RTABMAP_OBSTACLES are started unconditionally in
# navi_man __init__ (they feed VO input + /obstacles_cloud,/ground_cloud) and are
# independent of this flag. RTABMAP_MAPPING is still started on demand by the
# UNDOCK new-indoor-map flow and by explicit UI map create/edit/save.
# true = legacy behavior (bring rtabmap up in localization mode on every map load).
rtabmap_on_start: false

# Map source that is DISPLAYED and SERVED on /navi_manager/map at boot (feeds the
# global costmap static layer, the planner and the UI). Localization v2: default to
# the mapping_v3 octomap raster (mapping_manager /mapping_manager/site_map), so
# rtabmap is not needed to have a map. Switchable live via /navi_manager/show_map.
#   "octomap" = mapping_v3 site raster (default, new normal)
#   "planner" = planner-edited grid (legacy default)
#   "rtabmap" = rtabmap grid_map (starts RTABMAP_MAPPING on demand)
map_source_on_start: "octomap"

# ============================================================================
# SITE-NATIVE MODE  (mapping-v3 site bundles as the runtime map authority)
# ============================================================================
# DEFAULT: false. This is the path to RETIRING the legacy rtabmap navi maps.
# When TRUE it flips three things (all no-ops when false — legacy path byte-for-
# byte unchanged):
#   1. navi_man boot map source is FORCED to "octomap" (the served site raster).
#   2. navi_man map->odom GEOREF datum comes from the served site's datum.yaml
#      (refined, n-sample datum) instead of the legacy map pickle datum — with a
#      one-time WARN of the delta (proceeds regardless; today's delta is mm/mrad).
#   3. navi_man SKIPS the rtabmap .db copy on map load (rtabmap is out of the
#      runtime), and node_planner REBUILDS its zone-generation workspace raster
#      from the served /mapping_manager/site_map instead of the legacy raster.
#
# !!! DO NOT flip this to true until AFTER a FULL-COVERAGE mapping drive of the
# !!! garden has produced a served site raster: the planner needs FREE space in
# !!! that raster to generate zone coverage paths. A partial raster = zones with
# !!! no coverage. Also assumes rtabmap_on_start: false. Flip procedure + the
# !!! post-flip verification checklist live in vitulus_navi/SITE_BUNDLE_PLAN.md
# !!! ("Site-native flip"). Rollback = set back to false (no data migration).
site_native: true

# ============================================================================
# LEGACY-MAPS RETIREMENT  (delegacy 2026-07-19, user directive)
# ============================================================================
# false (DEFAULT + set here per the directive): the robot boots and runs PURELY
# on the mapping-v3 served-site world. NO legacy navi map is loaded — navi_man
# SKIPS load_map_on_start entirely, sets active_map='SITE' (OUTDOOR), starts the
# localization launch directly, and takes waypoints/paths/datum from the
# CURRENTLY SERVED site's bundle (/mapping_manager/status -> serving.site). If no
# site is served at boot, running_map_data is EMPTY (a one-line warn) and the
# dock 'docked' seed retries until a site + its 'docked' waypoint arrive; the
# robot runs odom-frame (GPS owns map->odom via navi_transform's own
# site_datum.yaml fallback) until then.
#
# true = ROLLBACK to the legacy path: load_map_on_start is honoured again (also
# UNCOMMENT that line above), bundle site is resolved by manifest.navi_map ==
# active_map, and the map pickle supplies waypoints + datum. Byte-for-byte the
# pre-delegacy behaviour.
#
# NOTE: assumes site_native: true and rtabmap_on_start: false (both set above).
legacy_maps: false
