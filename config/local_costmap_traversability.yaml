# Local traversability map (package vitulus_traversability, /traversability/local_costmap) as one more layer of the
# LOCAL costmap of move_base_flex. OFF by default: vitulus_navi_mbf.launch loads this file only when the robot sets
# BOTH VITULUS_TRAVERSABILITY_NAV=true (this layer) and VITULUS_TRAVERSABILITY=true (the node that publishes the map,
# vitulus_depth_obstacles); see README "Traversability layer". Not loaded = the costmap is exactly as before.
#
# Loaded inside the move_base_flex node of vitulus_navi_mbf.launch, after local_costmap_params.yaml, so it is set
# after that launch's "rosparam delete move_base_flex" (parameters loaded from any other launch are wiped there).
#
# NOTE: a costmap_2d::StaticLayer waits in its initialisation until the first map arrives ("Requesting the
# map..."). traversability_local publishes an all-unknown (neutral) map from its start until its first cloud, so a
# missing camera / TF does not hold move_base_flex; the node not running at all does (obstacles_engine must be
# depth_obstacles in navi_manager.yaml, README "Traversability layer").
local_costmap:
  # = plugins of local_costmap_params.yaml with traversability_layer before inflation_layer (a list is replaced as a
  # whole; test/test_traversability_switch.py keeps the two in step)
  plugins:
    - {name: base_static_layer, type: "costmap_2d::StaticLayer"}
    - {name: cloud_costmap_layer, type: "costmap_2d::StaticLayer"}
    - {name: lidar_costmap_layer, type: "costmap_2d::StaticLayer"}
    - {name: traversability_layer, type: "costmap_2d::StaticLayer"}
    - {name: inflation_layer,  type: "costmap_2d::InflationLayer"}

  traversability_layer:
    map_topic: /traversability/local_costmap   # nav_msgs/OccupancyGrid 6 x 6 m, odom, 0..99 graded, 100 lethal, -1 unknown
    subscribe_to_updates: false     # the node publishes the whole window each time (no OccupancyGridUpdate)
    track_unknown_space: false      # -1 -> FREE: unknown terrain does not block (the obstacle layers still do)
    use_maximum: true               # max with the other layers, never lowers their cost
    trinary_costmap: false          # graded: value / lethal_cost_threshold * 254, like cloud_costmap_layer (AUDIT A16)
    lethal_cost_threshold: 100
    unknown_cost_value: -1
